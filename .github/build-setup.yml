- name: Install Python for artifact smoke checks
  uses: actions/setup-python@v5
  with:
    python-version: '3.x'
- name: Collect third-party license notices
  shell: bash
  run: python .github/scripts/prepare-notices.py
- name: Set deployment target for Candle Metal
  if: runner.os == 'macOS'
  shell: bash
  run: echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"

name: Performance contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Select a fresh evidence directory
        shell: bash
        run: echo "PERF_CI_ROOT=${{ runner.temp }}/talechime-perf-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config cmake ninja-build
      - run: cargo test --locked -p xtask
      - run: cargo clippy --locked -p xtask --all-targets -- -D warnings
      - run: cargo test --locked -p talechime-backends --no-default-features --features performance-tools --lib --example performance_probe
      - run: cargo bench --locked -p talechime-core --bench text_performance -- --test
      - run: cargo doc --locked --no-deps -p xtask -p talechime-core -p talechime-backends --no-default-features --features talechime-backends/performance-tools
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Windows synthetic end-to-end evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo xtask perf build --probe performance_probe --output $env:PERF_CI_ROOT/ci-build.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask perf fixture-job --build $env:PERF_CI_ROOT/ci-build.json --output $env:PERF_CI_ROOT/ci-input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TALECHIME_PERF_PROBE_BUILD = (Resolve-Path $env:PERF_CI_ROOT/ci-build.json).Path
          cargo test --locked -p xtask --test cancellation_cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = ''
          $commands = @(
            @('run', '--job', "$env:PERF_CI_ROOT/ci-input/job.json", '--output', "$env:PERF_CI_ROOT/ci-run"),
            @('resume', '--job', "$env:PERF_CI_ROOT/ci-input/job.json", '--output', "$env:PERF_CI_ROOT/ci-run"),
            @('overhead', '--job', "$env:PERF_CI_ROOT/ci-input/job.json", '--output', "$env:PERF_CI_ROOT/ci-overhead"),
            @('report', '--run', "$env:PERF_CI_ROOT/ci-run", '--output', "$env:PERF_CI_ROOT/ci-report"),
            @('pack', '--report', "$env:PERF_CI_ROOT/ci-report", '--output', "$env:PERF_CI_ROOT/ci-report.zip")
          )
          foreach ($arguments in $commands) {
            & target/debug/xtask.exe perf @arguments
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Mac synthetic end-to-end evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask perf build --probe performance_probe --output ${PERF_CI_ROOT}/ci-build.json
          cargo xtask perf fixture-job --build ${PERF_CI_ROOT}/ci-build.json --output ${PERF_CI_ROOT}/ci-input
          export TALECHIME_PERF_PROBE_BUILD="${PERF_CI_ROOT}/ci-build.json"
          cargo test --locked -p xtask --test cancellation_cli
          PATH='' target/debug/xtask perf run --job ${PERF_CI_ROOT}/ci-input/job.json --output ${PERF_CI_ROOT}/ci-run
          PATH='' target/debug/xtask perf resume --job ${PERF_CI_ROOT}/ci-input/job.json --output ${PERF_CI_ROOT}/ci-run
          PATH='' target/debug/xtask perf overhead --job ${PERF_CI_ROOT}/ci-input/job.json --output ${PERF_CI_ROOT}/ci-overhead
          PATH='' target/debug/xtask perf report --run ${PERF_CI_ROOT}/ci-run --output ${PERF_CI_ROOT}/ci-report
          PATH='' target/debug/xtask perf pack --report ${PERF_CI_ROOT}/ci-report --output ${PERF_CI_ROOT}/ci-report.zip
          printf '%s\n' '{"schema":"talechime/performance/1","metric":"rtf","lower_is_better":true,"absolute_threshold":0.01,"relative_threshold":0.1,"expected_processes":3,"require_equal_output":true}' > ${PERF_CI_ROOT}/ci-policy.json
          PATH='' target/debug/xtask perf compare --baseline ${PERF_CI_ROOT}/ci-run/results.json --candidate ${PERF_CI_ROOT}/ci-run/results.json --policy ${PERF_CI_ROOT}/ci-policy.json --output ${PERF_CI_ROOT}/ci-compare.json

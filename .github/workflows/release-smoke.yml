name: Verify release archives and installers
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux playback runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2t64
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-dist 0.32.0
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Install cargo-dist 0.32.0 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1 | iex
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib
          merge-multiple: true
      - name: Verify the exact release archive and platform installer
        env:
          RELEASE_TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: python .github/scripts/distribution-smoke.py talechime ${{ matrix.target }} --skip-build --build-installers

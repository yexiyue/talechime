[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
# generate-release.py regenerates CI and applies our strict host gate. Native
# dist checks cannot reproduce that gate; the wrapper is checked in CPU CI.
allow-dirty = ["ci"]
ci = "github"
recursive-tarball = false
packages = ["talechime"]
precise-builds = true
installers = ["shell", "powershell", "homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
tag-namespace = "talechime-v"
tap = "yexiyue/homebrew-tap"
publish-jobs = ["homebrew"]
plan-jobs = ["./ci", "./performance-contracts"]
global-artifacts-jobs = ["./release-smoke"]
install-path = "CARGO_HOME"
install-updater = false
msvc-crt-static = false
features = ["cli", "asr", "qwen", "voxcpm", "omnivoice", "cosyvoice3", "moss-candle", "moss-nano-candle", "kokoro-g2pw"]
include = ["LICENSE", "SOURCE.md", "docs", "assets", "target/third-party-licenses"]
github-build-setup = "../build-setup.yml"
pr-run-mode = "plan"

[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-unknown-linux-gnu = "ubuntu-24.04"

[dist.min-glibc-version]
x86_64-unknown-linux-gnu = "2.39"

[dist.dependencies.apt]
libasound2-dev = "*"
libssl-dev = "*"
pkg-config = "*"

# cargo-dist 0.32 has one Cargo feature list. The build-setup selector adds
# these features only on the native macOS builder, before notices/builds.
[talechime-release]
required-host-jobs = ["plan", "custom-ci", "custom-performance-contracts", "build-local-artifacts", "build-global-artifacts", "custom-release-smoke"]
macos-features = ["qwen-metal", "voxcpm-metal", "omnivoice-metal", "cosyvoice3-metal", "moss-candle-metal", "moss-nano-candle-metal", "kokoro-metal"]

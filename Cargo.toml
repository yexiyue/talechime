[workspace]
members = ["crates/moss-tts", "crates/talechime", "crates/talechime-backends", "crates/talechime-core", "crates/talechime-protocol", "crates/omnivoice", "crates/qwen3-tts", "crates/tts-candle-platform", "crates/voxcpm", "crates/voxcpm-sys"]
default-members = ["crates/talechime"]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
windows = { version = "0.54.0", default-features = false }
moss-tts = { path = "crates/moss-tts", default-features = false }
omnivoice = { path = "crates/omnivoice", default-features = false }
voxcpm = { path = "crates/voxcpm", default-features = false }
tts-candle-platform = { path = "crates/tts-candle-platform", version = "0.1.0" }
cmake = "0.1.58"
cc = "1.2"
qwen3-tts = { path = "crates/qwen3-tts", version = "0.3.0", default-features = false }
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
candle-metal-kernels = "=0.11.0"
tokenizers = { version = "0.22.2", default-features = false }
hound = "3.5"
rustfft = "6.4"
tracing = "0.1"
# API 21 leaves device selection to the application instead of enabling ORT's auto EP policy.
# Native prebuilt libraries still use the latest ONNX Runtime 1.28.
# Lax matching permits platform-independent all-features checks; runtime EPs stay explicit.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "tracing", "download-binaries", "tls-native", "copy-dylibs",
    "api-21", "pkg-config", "lax-feature-matching",
] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav", "tracing"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12"
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1.52", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.18"
futures = "0.3.32"
dirs = "6.0.0"
sha2 = "0.10.9"
tempfile = "3.27.0"


[profile.release]
lto = true
opt-level = 3
panic = "abort"

[profile.dist]
inherits = "release"

[profile.dev.package.sha2]
opt-level = 3

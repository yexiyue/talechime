[package]
name = "talechime-qwen3-tts"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Local Candle inference library for Qwen3-TTS"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
cuda = ["candle-transformers/cuda", "dep:cudarc"]
metal = ["candle-nn/metal"]
profiling = ["dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
candle-nn.workspace = true
candle-core.workspace = true
candle-transformers.workspace = true
tokenizers = { workspace = true, features = ["onig"] }
hound.workspace = true
rubato = "1.0"
rustfft.workspace = true
safetensors = "0.7"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", optional = true }
rayon = "1.10"
byteorder = "1.5"
num-traits = "0.2"
num-complex = "0.4"
audioadapter-buffers = "2.0.0"
tracing-chrome = { version = "0.7", optional = true }

# macOS CPU matmuls use Accelerate/AMX BLAS, matching CosyVoice3. This
# changes CPU numerics; Metal paths are unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }

[dev-dependencies]
approx = "0.5"
tempfile.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cudarc = { workspace = true, optional = true }

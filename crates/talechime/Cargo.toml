[package]
name = "talechime"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
default-run = "talechime"
description = "Local speech synthesis, continuous listening and JSON Lines worker"
repository = "https://github.com/yexiyue/talechime"
homepage = "https://github.com/yexiyue/talechime"

[[bin]]
name = "talechime"
path = "src/main.rs"
required-features = ["cli"]

[features]
kokoro = ["talechime-backends/kokoro"]
kokoro-g2pw = ["kokoro", "talechime-backends/kokoro-g2pw"]
kokoro-metal = ["kokoro", "talechime-backends/kokoro-metal"]
kokoro-cuda = ["kokoro", "talechime-backends/kokoro-cuda"]
indextts = ["talechime-backends/indextts"]
indextts-metal = ["indextts", "talechime-backends/indextts-metal"]
indextts-cuda-cudnn = ["indextts", "talechime-backends/indextts-cuda-cudnn"]
cosyvoice3 = ["talechime-backends/cosyvoice3"]
cosyvoice3-metal = ["cosyvoice3", "talechime-backends/cosyvoice3-metal"]
cosyvoice3-cuda = ["cosyvoice3", "talechime-backends/cosyvoice3-cuda"]
default = ["cli", "moss-nano-candle"]
asr = ["talechime-backends/asr", "dep:hound"]
playback = ["dep:rodio"]
cli = ["playback", "dep:clap", "dep:crossterm", "dep:futures", "dep:serde_json", "dep:tempfile"]
moss = ["talechime-backends/moss"]
moss-nano-candle = ["moss", "talechime-backends/moss-nano-candle"]
moss-nano-candle-metal = ["moss-nano-candle", "talechime-backends/moss-nano-candle-metal"]
moss-nano-candle-cuda = ["moss-nano-candle", "talechime-backends/moss-nano-candle-cuda"]
moss-candle = ["moss", "talechime-backends/moss-candle"]
moss-candle-cuda = ["moss-candle", "talechime-backends/moss-candle-cuda"]
moss-candle-metal = ["moss-candle", "talechime-backends/moss-candle-metal"]
qwen = ["talechime-backends/qwen"]
qwen-metal = ["qwen", "talechime-backends/qwen-metal"]
qwen-cuda = ["qwen", "talechime-backends/qwen-cuda"]
voxcpm = ["talechime-backends/voxcpm"]
voxcpm-cuda = ["voxcpm", "talechime-backends/voxcpm-cuda"]
voxcpm-metal = ["voxcpm", "talechime-backends/voxcpm-metal"]
omnivoice = ["talechime-backends/omnivoice"]
omnivoice-cuda = ["omnivoice", "talechime-backends/omnivoice-cuda"]
omnivoice-metal = ["omnivoice", "talechime-backends/omnivoice-metal"]

[dependencies]
rodio = { workspace = true, optional = true }
talechime-backends = { path = "../talechime-backends", version = "0.3.0", default-features = false }
talechime-core = { path = "../talechime-core", version = "0.5.0" }
talechime-protocol = { path = "../talechime-protocol", version = "0.3.1" }
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

hound = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "verified_synthesis"
required-features = ["asr"]

[[example]]
name = "readback_corpus"
required-features = ["asr", "cli"]

[[example]]
name = "cosyvoice3_backend"
required-features = ["cosyvoice3"]

[[example]]
name = "kokoro_backend"
required-features = ["kokoro"]

[package]
name = "talechime"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
default-run = "talechime"
description = "Local speech synthesis, continuous listening and JSON Lines worker"
repository = "https://github.com/yexiyue/talechime"
homepage = "https://github.com/yexiyue/talechime"

[[bin]]
name = "talechime"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "moss"]
asr = ["tts-backends/asr", "dep:hound"]
cli = ["dep:clap", "dep:crossterm", "dep:futures", "dep:serde_json", "dep:tempfile"]
moss = ["tts-backends/moss"]
moss-nano-candle = ["moss", "tts-backends/moss-nano-candle"]
moss-nano-candle-metal = ["moss-nano-candle", "tts-backends/moss-nano-candle-metal"]
moss-nano-candle-cuda = ["moss-nano-candle", "tts-backends/moss-nano-candle-cuda"]
moss-candle = ["moss", "tts-backends/moss-candle"]
moss-candle-cuda = ["moss-candle", "tts-backends/moss-candle-cuda"]
moss-candle-metal = ["moss-candle", "tts-backends/moss-candle-metal"]
qwen = ["tts-backends/qwen"]
qwen-metal = ["qwen", "tts-backends/qwen-metal"]
ort-coreml = ["tts-backends/ort-coreml"]
ort-cuda = ["tts-backends/ort-cuda"]
qwen-cuda = ["qwen", "tts-backends/qwen-cuda"]
voxcpm = ["tts-backends/voxcpm"]
voxcpm-cuda = ["voxcpm", "tts-backends/voxcpm-cuda"]
voxcpm-metal = ["voxcpm", "tts-backends/voxcpm-metal"]
omnivoice = ["tts-backends/omnivoice"]
omnivoice-cuda = ["omnivoice", "tts-backends/omnivoice-cuda"]
omnivoice-metal = ["omnivoice", "tts-backends/omnivoice-metal"]

[dependencies]
tts-backends = { package = "talechime-backends", path = "../talechime-backends", version = "0.1.0", default-features = false }
tts-core = { package = "talechime-core", path = "../talechime-core", version = "0.3.0" }
tts-protocol = { package = "talechime-protocol", path = "../talechime-protocol", version = "0.1.0" }
anyhow.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

hound = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "verified_synthesis"
required-features = ["asr"]

[[example]]
name = "readback_corpus"
required-features = ["asr", "cli"]

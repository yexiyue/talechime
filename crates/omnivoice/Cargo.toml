[package]
name = "talechime-omnivoice"
version="0.1.1"
edition="2024"
license="Apache-2.0"
description="Native Candle OmniVoice inference for Talechime"
repository="https://github.com/yexiyue/talechime"

[dependencies]
candle-nn.workspace = true
candle-core.workspace=true
candle-transformers.workspace=true
cudarc = { workspace = true, optional = true }
tracing.workspace = true
half="2.4.1"
hound.workspace=true
regex.workspace=true
safetensors="0.7.0"
serde.workspace=true
serde_json.workspace=true
strsim="0.11.1"
symphonia={version="0.5.5",default-features=false,features=["aac","flac","isomp4","mp3","ogg","pcm","vorbis","wav"]}
thiserror.workspace=true
tokenizers={workspace=true,features=["fancy-regex"]}
rand="0.9"
unicode-general-category="1.1.0"
[features]
default=[]
cuda = ["candle-transformers/cuda", "dep:cudarc"]
metal = ["candle-nn/metal"]

[dev-dependencies]
tempfile.workspace=true

[[example]]
name="gemm_probe"
required-features=["metal"]

[[example]]
name="gqa_probe"
required-features=["metal"]

[[example]]
name="scoring_probe"
required-features=["metal"]

[[example]]
name="decoder_ops_probe"
required-features=["metal"]

[[example]]
name="gemm_merge_probe"
required-features=["metal"]

[[example]]
name="attention_layout_probe"
required-features=["metal"]

[[example]]
name="attention_copyfree_probe"
required-features=["metal"]

[[example]]
name="conv7_layout_probe"
required-features=["metal"]

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }

[package]
name = "talechime-moss-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle computation for MOSS speech models"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
cuda = ["candle-transformers/cuda"]
metal = ["candle-nn/metal"]

[dependencies]
candle-nn.workspace = true
anyhow.workspace = true
candle-core.workspace = true
candle-transformers.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers = { workspace = true, features = ["fancy-regex"] }
hound.workspace = true
rand = "0.9"

[dev-dependencies]
tempfile.workspace = true

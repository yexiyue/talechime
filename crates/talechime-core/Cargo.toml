[package]
name = "talechime-core"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Session, synthesis and playback core for Talechime"
authors = ["yexiyue <yexiyue666@qq.com>"]
license = "MIT"
keywords = ["Novel", "TTS"]
repository = "https://github.com/yexiyue/talechime"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
talechime-protocol = { path = "../talechime-protocol", version = "0.4.0" }
regex.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
zip.workspace = true
hound.workspace = true
ferrous-opencc.workspace = true
chinese-number.workspace = true
rand = "0.9"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "text_performance"
harness = false

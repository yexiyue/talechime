[package]
name = "talechime-cloud-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Independent cloud speech synthesis clients for Talechime"
repository = "https://github.com/yexiyue/talechime"

[dependencies]
reqwest = { workspace = true, features = ["json", "multipart", "query", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

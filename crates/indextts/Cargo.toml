[package]
name = "talechime-indextts"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle IndexTTS 2.5 inference from converted official checkpoints"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# cuDNN convolutions (recommended on CUDA: the conv-heavy regulator /
# BigVGAN / CAMPPlus stacks otherwise hit candle's strided-matmul conv
# fallback, which rejects some layouts).
cuda-cudnn = ["cuda", "candle-core/cudnn"]
# candle-metal-kernels/objc2-metal power the custom-op Metal kernels in
# src/metal_fused.rs (hosted kernels, no candle fork); both are already in
# the tree through candle.
metal = [
    "candle-nn/metal",
    "candle-core/metal",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
]

[dependencies]
candle-nn.workspace = true
candle-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rand.workspace = true
rustfft.workspace = true
hound.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }

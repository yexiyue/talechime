[package]
name = "talechime-indextts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle IndexTTS 2.5 inference from converted official checkpoints"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# cuDNN convolutions (recommended on CUDA: the conv-heavy regulator /
# BigVGAN / CAMPPlus stacks otherwise hit candle's strided-matmul conv
# fallback, which rejects some layouts).
cuda-cudnn = ["cuda", "candle-core/cudnn"]
metal = ["candle-nn/metal"]

[dependencies]
candle-nn.workspace = true
candle-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rand.workspace = true
rustfft.workspace = true
hound.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true

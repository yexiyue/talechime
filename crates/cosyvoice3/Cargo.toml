[package]
name = "talechime-cosyvoice3"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle inference for Fun-CosyVoice3-0.5B with optional ORT reference paths"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
cuda = ["candle-transformers/cuda"]
metal = ["candle-nn/metal"]
# Official ONNX artifacts: campplus / speech_tokenizer_v3 frontends and the
# export_onnx.py flow estimator used for numeric comparison against Candle.
ort = ["dep:ort"]

# macOS builds link the system Accelerate framework (AMX BLAS) for CPU
# matmuls by default (owner decision 2026-10-18). Numerics differ from the
# pure-Rust `gemm` path used on other targets — see the performance record
# before relying on cross-platform bit-parity.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }

[dependencies]
candle-nn.workspace = true
candle-core.workspace = true
candle-transformers.workspace = true
tokenizers = { workspace = true, features = ["onig"] }
serde.workspace = true
serde_json.workspace = true
ort = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
hound.workspace = true
tokio.workspace = true

[[example]]
name = "bench"
required-features = ["ort"]

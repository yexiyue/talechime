[package]
name = "talechime-backends"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native model adapters for Talechime"
repository = "https://github.com/yexiyue/talechime"

[features]
default = ["moss"]
moss = ["dep:ort", "dep:sentencepiece-rs", "dep:rand", "dep:hound", "dep:rubato"]
moss-candle = ["moss", "dep:moss-tts", "dep:candle-core"]
moss-candle-cuda = ["moss-candle", "moss-tts/cuda"]
moss-candle-metal = ["moss-candle", "moss-tts/metal", "tts-candle-platform/metal"]
qwen = ["dep:qwen3-tts", "dep:hound"]
qwen-metal = ["qwen", "qwen3-tts/metal", "tts-candle-platform/metal"]
qwen-cuda = ["qwen", "qwen3-tts/cuda"]
voxcpm = ["dep:voxcpm", "dep:candle-core", "dep:hound", "dep:rubato"]
voxcpm-cuda = ["voxcpm", "voxcpm/cuda"]
voxcpm-metal = ["voxcpm", "voxcpm/metal", "tts-candle-platform/metal"]
omnivoice = ["dep:omnivoice", "dep:hound", "dep:rubato"]
omnivoice-cuda = ["omnivoice", "omnivoice/cuda"]
omnivoice-metal = ["omnivoice", "omnivoice/metal", "tts-candle-platform/metal"]
ort-coreml = ["dep:ort", "ort/coreml"]
ort-cuda = ["dep:ort", "ort/cuda"]
directml-probe = ["moss", "ort/directml", "dep:windows"]

[dependencies]
tts-candle-platform.workspace = true
moss-tts = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
omnivoice = { workspace = true, optional = true }
voxcpm = { workspace = true, optional = true }
qwen3-tts = { workspace = true, optional = true }
tts-core = { package = "talechime-core", path = "../talechime-core", version = "0.3.0" }
tts-protocol = { package = "talechime-protocol", path = "../talechime-protocol", version = "0.1.0" }
ort = { workspace = true, optional = true }
sentencepiece-rs = { version = "0.2.2", optional = true }
rand = { version = "0.9", optional = true }
hound = { workspace = true, optional = true }
rubato = { version = "0.16", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }

[[example]]
name = "moss_directml_probe"
required-features = ["directml-probe"]

[[example]]
name = "moss"
required-features = ["moss"]

[[example]]
name = "device_calibration"
required-features = ["moss"]

[[example]]
name = "continuity"
required-features = ["moss"]
[[example]]
name = "moss_probe"
required-features = ["moss"]

[[example]]
name = "qwen"
required-features = ["qwen"]


[dev-dependencies]
candle-core.workspace = true

[[example]]
name = "native_probe"
required-features = ["qwen"]

[[example]]
name = "voxcpm_candle_probe"
required-features = ["voxcpm"]


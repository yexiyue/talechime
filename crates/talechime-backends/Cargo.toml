[package]
name = "talechime-backends"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native model adapters for Talechime"
repository = "https://github.com/yexiyue/talechime"

[features]
performance-tools = ["dep:tracing", "dep:metrics"]
indextts = ["dep:talechime-indextts", "dep:candle-core", "dep:hound", "dep:rubato"]
indextts-metal = ["indextts", "talechime-indextts/metal", "dep:candle-metal-kernels"]
indextts-cuda-cudnn = ["indextts", "talechime-indextts/cuda-cudnn"]
cosyvoice3 = ["dep:talechime-cosyvoice3", "talechime-cosyvoice3/ort", "dep:candle-core", "dep:hound", "dep:rubato"]
cosyvoice3-metal = ["cosyvoice3", "talechime-cosyvoice3/metal", "dep:candle-metal-kernels"]
cosyvoice3-cuda = ["cosyvoice3", "talechime-cosyvoice3/cuda"]
default = ["moss-nano-candle"]
asr = ["dep:reqwest", "dep:talechime-qwen3-asr", "dep:candle-core", "dep:ort", "dep:kaldi-fbank", "dep:rubato", "dep:hound"]
moss = ["dep:reqwest", "dep:sentencepiece-rs", "dep:hound", "dep:rubato", "dep:talechime-moss-tts", "dep:candle-core"]
moss-nano-candle = ["moss"]
moss-nano-candle-metal = ["moss-nano-candle", "talechime-moss-tts/metal", "dep:candle-metal-kernels"]
moss-nano-candle-cuda = ["moss-nano-candle", "talechime-moss-tts/cuda"]
moss-candle = ["moss"]
experimental-moss-reference-anchor = ["moss-candle"]
moss-candle-cuda = ["moss-candle", "talechime-moss-tts/cuda"]
moss-candle-metal = ["moss-candle", "talechime-moss-tts/metal", "dep:candle-metal-kernels"]
qwen = ["dep:reqwest", "dep:talechime-qwen3-tts", "dep:hound", "dep:rubato"]
qwen-metal = ["qwen", "talechime-qwen3-tts/metal", "dep:candle-metal-kernels"]
qwen-cuda = ["qwen", "talechime-qwen3-tts/cuda"]
voxcpm = ["dep:reqwest", "dep:talechime-voxcpm", "dep:candle-core", "dep:hound", "dep:rubato"]
experimental-dual-reference = ["voxcpm", "talechime-voxcpm/experimental-dual-reference"]
voxcpm-cuda = ["voxcpm", "talechime-voxcpm/cuda"]
voxcpm-metal = ["voxcpm", "talechime-voxcpm/metal", "dep:candle-metal-kernels"]
omnivoice = ["dep:reqwest", "dep:talechime-omnivoice", "dep:hound", "dep:rubato"]
omnivoice-cuda = ["omnivoice", "talechime-omnivoice/cuda"]
omnivoice-metal = ["omnivoice", "talechime-omnivoice/metal", "dep:candle-metal-kernels"]

[dependencies]
reqwest = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
talechime-indextts = { workspace = true, optional = true }
talechime-cosyvoice3 = { workspace = true, optional = true }
talechime-moss-tts = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
talechime-omnivoice = { workspace = true, optional = true }
talechime-voxcpm = { workspace = true, optional = true }
talechime-qwen3-asr = { workspace = true, optional = true }
kaldi-fbank = { workspace = true, optional = true }
talechime-qwen3-tts = { workspace = true, optional = true }
talechime-core = { path = "../talechime-core", version = "0.5.0" }
talechime-protocol = { path = "../talechime-protocol", version = "0.3.1" }
ort = { workspace = true, optional = true }
sentencepiece-rs = { version = "0.2.2", optional = true }
hound = { workspace = true, optional = true }
rubato = { version = "0.16", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
sha2.workspace = true
tempfile.workspace = true

[[example]]
name = "moss"
required-features = ["moss-nano-candle"]

[[example]]
name = "device_calibration"
required-features = ["moss-nano-candle"]

[[example]]
name = "continuity"
required-features = ["moss-nano-candle"]
[[example]]
name = "moss_probe"
required-features = ["moss-nano-candle"]

[[example]]
name = "qwen"
required-features = ["qwen"]


[dev-dependencies]
tracing-subscriber.workspace = true
candle-core.workspace = true
hound.workspace = true

[[example]]
name = "performance_probe"
required-features = ["performance-tools"]

[[example]]
name = "performance_catalog"
required-features = ["performance-tools"]

[[example]]
name = "qwen_design_reference"
required-features = ["qwen", "performance-tools"]

[[example]]
name = "native_probe"
required-features = ["qwen"]

[[example]]
name = "voxcpm_candle_probe"
required-features = ["voxcpm"]

[[example]]
name = "asr_readback"
required-features = ["asr"]

[[example]]
name = "sensevoice_aux_readback"
required-features = ["asr"]

[[example]]
name = "continuation_probe"
required-features = ["moss", "qwen", "omnivoice"]

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels = { workspace = true, optional = true }

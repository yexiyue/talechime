[package]
name = "voxcpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle VoxCPM2 inference from the production GGUF weights"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
experimental-dual-reference = []
# Test-only macOS experiment. It does not expose a production API or change
# the default Metal build. The two features permit separate plain-CPU and
# Accelerate CPU builds so Cargo feature unification cannot contaminate them.
codec-experiment = []
accelerate-experiment = ["codec-experiment", "dep:candle-transformers"]
cuda = ["dep:candle-cuda-graph", "dep:tts-candle-platform", "tts-candle-platform/cuda"]
metal = ["dep:tts-candle-platform", "tts-candle-platform/metal"]

[dependencies]
candle-cuda-graph = { workspace = true, optional = true }
candle-core.workspace = true
candle-nn.workspace = true
tts-candle-platform = { workspace = true, optional = true }
serde_json.workspace = true
tracing.workspace = true
tokenizers = { workspace = true, features = ["onig"] }

# Feature carrier only for the isolated experiment. A second direct core alias
# conflicts with Cargo's same-package naming rule in all-features builds.
[target.'cfg(target_os = "macos")'.dependencies]
candle-transformers = { workspace = true, features = ["accelerate"], optional = true }

[dev-dependencies]
anyhow.workspace = true
hound.workspace = true
libc.workspace = true
rubato.workspace = true
tts-core.workspace = true


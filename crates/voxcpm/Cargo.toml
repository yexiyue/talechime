[package]
name = "voxcpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle VoxCPM2 inference from the production GGUF weights"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
experimental-dual-reference = []
cuda = ["dep:cudarc", "dep:tts-candle-platform", "tts-candle-platform/cuda"]
metal = ["dep:tts-candle-platform", "tts-candle-platform/metal"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
tts-candle-platform = { workspace = true, optional = true }
serde_json.workspace = true
tracing.workspace = true
tokenizers = { workspace = true, features = ["onig"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cudarc = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
hound.workspace = true


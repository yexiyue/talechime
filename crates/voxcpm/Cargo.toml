[package]
name = "talechime-voxcpm"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle VoxCPM2 inference from the production GGUF weights"
repository = "https://github.com/yexiyue/talechime"

[features]
default = []
# Test-only codec replay. macOS now always enables Accelerate; retain the
# historical accelerate-experiment feature for existing replay commands.
codec-experiment = []
accelerate-experiment = ["codec-experiment", "dep:candle-transformers"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:cudarc"]
metal = ["candle-nn/metal"]

[dependencies]
candle-nn.workspace = true
candle-core.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokenizers = { workspace = true, features = ["onig"] }

# Feature carrier only for the isolated experiment. A second direct core alias
# conflicts with Cargo's same-package naming rule in all-features builds.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }
candle-transformers = { workspace = true, features = ["accelerate"], optional = true }

[dev-dependencies]
anyhow.workspace = true
hound.workspace = true
libc.workspace = true
rubato.workspace = true
talechime-core.workspace = true
talechime-protocol.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cudarc = { workspace = true, optional = true }
